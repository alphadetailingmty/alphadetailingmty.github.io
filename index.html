<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Alpha Detailing" />
  <meta name="theme-color" content="#0e0e0e" />
  <title>Alpha Detailing</title>
  <link rel="manifest" href="manifest.json" />
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600;700&family=Barlow+Condensed:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, doc, setDoc, onSnapshot, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey:            "AIzaSyDDOq5wjFlPTcU5Eg4sgwF_1dt-8KZMpYA",
      authDomain:        "alpha-detailing-48abb.firebaseapp.com",
      projectId:         "alpha-detailing-48abb",
      storageBucket:     "alpha-detailing-48abb.firebasestorage.app",
      messagingSenderId: "826961797101",
      appId:             "1:826961797101:web:3a0838af90a4fbb744d1e4"
    };

    const fbApp = initializeApp(firebaseConfig);
    const db    = getFirestore(fbApp);

    window.__firebase = {
      saveCalendar: async (data) => {
        await setDoc(doc(db, "alpha", "calendar"), { data: JSON.stringify(data) });
      },
      onCalendarChange: (callback) => {
        return onSnapshot(doc(db, "alpha", "calendar"), (snap) => {
          if (snap.exists()) { try { callback(JSON.parse(snap.data().data)); } catch(e) {} }
        });
      },
      getCalendar: async () => {
        const snap = await getDoc(doc(db, "alpha", "calendar"));
        if (snap.exists()) { try { return JSON.parse(snap.data().data); } catch(e) {} }
        return null;
      },
      saveGastos: async (year, month, data) => {
        await setDoc(doc(db, "alpha", `gastos-${year}-${month}`), { data: JSON.stringify(data) });
      },
      getGastos: async (year, month) => {
        const snap = await getDoc(doc(db, "alpha", `gastos-${year}-${month}`));
        if (snap.exists()) { try { return JSON.parse(snap.data().data); } catch(e) {} }
        return null;
      },
      onGastosChange: (year, month, callback) => {
        return onSnapshot(doc(db, "alpha", `gastos-${year}-${month}`), (snap) => {
          if (snap.exists()) { try { callback(JSON.parse(snap.data().data)); } catch(e) {} }
        });
      }
    };

    window.dispatchEvent(new Event("firebase-ready"));
  </script>
  <script src="app.js"></script>
</body>
</html>
